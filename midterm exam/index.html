<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Volterra Racing</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Lato:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>

        <!-- 9 Dots -->
        <div class="dots">

            <span></span>
            <span></span>
            <span></span>

            <span></span>
            <span></span>
            <span></span>

            <span></span>
            <span></span>
            <span></span>

        </div>


        <!-- Left Navigation -->
        <nav class="left-nav">

            <a href="#">HOME</a>
            <a href="#">INFO</a>
            <a href="#">SUPPORT</a>

        </nav>


        <!-- Logo -->
        <div class="logo">

            <img src="car 3.png" alt="Ferrari Logo">

        </div>


        <!-- Right Navigation -->
        <nav class="right-nav">

            <a href="#">PARTNERSHIP</a>
            <a href="#">PRODUCT</a>

            <button>NEWSLETTER</button>

            <span class="search"></span>

        </nav>

    </header>


    <!-- Hero Section -->
    <section class="hero">

        <!-- Side Menu -->
        <div class="side-menu">

            <div class="active-line"></div>
            <div></div>
            <div></div>
            <div></div>

        </div>


        <!-- Gray Ground -->
        <div class="ground"></div>


        <!-- Floating Car -->
        <div class="car-area">

            <img src="car 1.png" alt="Formula Racing Car">

        </div>


        <!-- Shadow under Car -->
        <div class="car-shadow"></div>

    </section>


    <!-- Bottom Information -->
    <section class="bottom">


        <!-- Presentation -->
        <div class="presentation">

            <div class="car-small">

                <img src="car 2.avif" alt="Formula Racing Car">

            </div>


            <div class="play">
                ▶
            </div>


            <div class="presentation-text">

                <p>PRESENTATION</p>

                <h3>
                    VOLTERRA<br>
                    VR-24
                </h3>

            </div>

        </div>


        <!-- Specifications -->
        <div class="specifications">

            <div>
                <h4>1600 CC</h4>
                <p>ENGINE</p>
            </div>

            <div>
                <h4>TURBO</h4>
                <p>SINGLE TURBO</p>
            </div>

            <div>
                <h4>125,000 RPM</h4>
                <p>MAXIMUM RPM</p>
            </div>

        </div>


        <!-- Description -->
        <div class="description">

            <p>
                The Volterra VR-24 is a high-performance
                Formula racing car designed for speed,
                precision, and competitive racing.
            </p>

        </div>

    </section>

</body>

</html>
